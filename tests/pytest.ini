[pytest]
# ═══════════════════════════════════════════════════════════════
# Configuração central do pytest
# ═══════════════════════════════════════════════════════════════

# Pasta raiz dos testes
testpaths = tests

# Padrão de descoberta de arquivos e funções de teste
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores customizados
# Uso: @pytest.mark.unit / @pytest.mark.integration / @pytest.mark.e2e
markers =
    unit:        Testes unitários — sem dependências externas
    integration: Testes de integração — usa o TestClient do FastAPI
    e2e:         Testes end-to-end — performance e carga

# Exibe prints durante a execução (útil para debug)
log_cli = true
log_cli_level = INFO

# Mostra as N mais lentas ao final
# Para ativar: pytest --durations=10
addopts =
    --tb=short
    --strict-markers
    -v
